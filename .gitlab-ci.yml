stages: [test, build]
default:
  image: golang:1.27.4-bookworm
  cache:
    key: go-modules
    paths: [.cache/go]
variables:
  GOPATH: '$CI_PROJECT_DIR/.cache/go'
.node22: &node22
  image: node:22-bookworm
.test-js-common: &test-js-common
  <<: *node22
  stage: test
  needs: []
test:
  stage: test
  needs: [test-js]
  before_script:
    # `python3-esprima` no existe en bookworm: el apt respondía "E: Unable to locate package
    # python3-esprima" y el job moría con exit 100 antes de `go vet` (run 18246371597, y ya la
    # 17932428329 del 11-nov). Se instala el intérprete que la imagen de Go no trae y el parser
    # por pip, que es donde sí está.
    - apt-get update && apt-get install -y ffmpeg python3 python3-pip
    # PEP 668: el python del sistema viene marcado "externally managed" y pip se niega sin esto.
    - pip3 install --break-system-packages esprima
  script:
    - go vet ./...
    - go test -race -count=1 ./...
    - python3 scripts/jslint.py web/js
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
# Pass the generated web assets to the Go job so it tests the embedded bundle,
# not only the classic fallback.
test-js:
  <<: *test-js-common
  script:
    # Same prerequisite as GitHub CI (ci.yml): the bundle has to exist before the
    # tests that assert it run. Without this step ui-artifacts.test.mjs would
    # depend on npm ci reaching the network from inside a test.
    - node scripts/build-ui.mjs
    - node --test tests/*.test.mjs
    - for f in web/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
    - node --check web/sw.js
  artifacts:
    paths:
      - web/studio.html
      - web/js/*-????????.js
      - web/css/*-????????.css
      - web/js/sw-assets.json
test-ui:
  <<: *test-js-common
  needs: []
  cache:
    key: ui-node-modules
    paths: [ui/node_modules]
  script:
    # Vitest lives in ui/node_modules/.bin, so the package manager runs with
    # cwd=ui (npm --prefix does not move the script cwd since npm 11).
    # `npm test` a secas respondía "sh: 1: vitest: not found" y exit 127 (run 18246371599):
    # la caché `ui-node-modules` estaba vacía —"WARNING: file does not exist / Failed to
    # extract cache"— porque ningún job la ha guardado nunca. Se instala siempre; la caché
    # solo ahorra tiempo cuando exista.
    - cd ui && npm ci --no-audit --no-fund && npm test
binaries:
  stage: build
  # make all chains the `ui` target unconditionally, so this job needs node and
  # npm next to go; the default Go image ships neither (exit 127).
  # node:22-bookworm carries npm out of the box; the Go toolchain is fetched
  # from go.dev because Debian's own golang-go lags several minors behind
  # go.mod. The URL is pinned per-architecture on purpose: a single hard-coded
  # amd64 link would silently cross-compile for the wrong arch on arm64 runners.
  image:
    name: node:22-bookworm
    entrypoint: [""]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl unzip git make
    - GO_ARCH=$(dpkg --print-architecture)
    - curl -fsSL "https://go.dev/dl/go1.27.4.linux-${GO_ARCH}.tar.gz" | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH"
    - go version
    # `make all` chains the ui prerequisite, so npm must resolve from the job
    # shell exactly as scripts/build-ui.mjs spawns it.
    - npm --version
  script:
    - make all
    - cd dist && sha256sum streamwebrom-* > SHA256SUMS.txt
  artifacts:
    paths: [dist/]
    expire_in: 30 days
windows-launcher:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs: [binaries]
  script:
    - dotnet publish windows/StreamWebRom.Launcher -c Release -o dist/windows-launcher
    - mv dist/windows-launcher/StreamWebRom.exe dist/StreamWebRom-Windows-x64.exe
  artifacts:
    paths: [dist/StreamWebRom-Windows-x64.exe]
    expire_in: 30 days
