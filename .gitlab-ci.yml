stages: [test, build]
default:
  image: golang:1.27-bookworm
  cache:
    key: go-modules
    paths: [.cache/go]
variables:
  GOPATH: '$CI_PROJECT_DIR/.cache/go'
test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y ffmpeg python3-esprima
  script:
    - go vet ./...
    - go test -race -count=1 ./...
    - python3 scripts/jslint.py web/js
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
test-js:
  stage: test
  image: node:22-bookworm
  script:
    - node --test tests/*.test.mjs
    - for f in web/js/*.js; do node --input-type=module --check < "$f"; done
    - node --check web/sw.js
binaries:
  stage: build
  script:
    - make all
    - cd dist && sha256sum * > SHA256SUMS.txt
  artifacts:
    paths: [dist/]
    expire_in: 30 days
windows-launcher:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs: [binaries]
  script:
    - dotnet publish windows/StreamWebRom.Launcher -c Release -o dist/windows-launcher
    - mv dist/windows-launcher/StreamWebRom.exe dist/StreamWebRom-Windows-x64.exe
  artifacts:
    paths: [dist/StreamWebRom-Windows-x64.exe]
    expire_in: 30 days
