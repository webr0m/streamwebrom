<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unirse · StreamWebRom</title>
<link rel="icon" href="/img/logo.svg"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#141518"><link rel="apple-touch-icon" href="/img/icon-192.png"><link rel="stylesheet" href="/css/app.css">
</head>
<body>
<section id="pre" class="prejoin">
  <div class="col">
    <div class="brand"><img src="/img/logo.svg" alt="">StreamWebRom</div>
    <div class="preview"><video id="preview" muted playsinline autoplay></video></div>
    <div class="muted" id="devWarn" style="font-size:12px"></div>
    <div class="meter"><i id="meter"></i></div>
  </div>
  <div class="card col">
    <h2 id="roomTitle">Unirse al programa</h2>
    <div><label for="name">Tu nombre</label><input id="name" maxlength="40" autocomplete="name"></div>
    <div id="pwBox" class="hidden"><label for="pw">Contraseña</label><input id="pw" type="password" maxlength="128"></div>
    <div id="devPre" class="col"></div>
    <div id="camCtlPre"></div>
    <details><summary>Opciones avanzadas de conexión</summary>
      <label for="networkMode">Conexión</label>
      <select id="networkMode"><option value="auto">Automática (recomendada)</option><option value="tls">Red móvil: conexión cifrada por 443</option><option value="local">Alternativa: relé del equipo anfitrión</option></select>
    </details>
    <button class="primary" id="joinBtn">Entrar</button>
    <p class="muted" id="hint" style="margin:0;font-size:12px">Tu video solo sale en vivo cuando el anfitrión te sube al escenario.</p>
  </div>
</section>

<section id="waiting" class="landing hidden"><div class="card"><h2>Esperando al anfitrión…</h2><p class="muted">Te dejarán entrar en un momento.</p></div></section>

<section id="call" class="call hidden">
  <div id="connection" class="connection-status hidden" role="status" aria-live="polite">
    <p id="connectionText"></p>
    <div id="connectionActions" class="hidden">
      <button id="retryMedia" class="primary">Reintentar entrada</button>
      <a href="/diagnostics" target="_blank" rel="noopener">Diagnóstico de conexión</a>
    </div>
  </div>
  <div class="call-grid-tools"><span>Toca un video para ampliarlo</span><button id="restoreGrid" class="small hidden">Ver todos</button></div>
  <div id="screenShareStatus" class="screen-share-status hidden" role="status" aria-live="polite"><span id="screenShareText" class="grow"></span><button id="startScreen" class="small primary hidden">Compartir pantalla</button><button id="cancelScreen" class="small">Cancelar</button></div>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <button class="icon on" id="micBtn" data-icon="mic" title="Micrófono (M)" aria-label="Micrófono"></button>
    <button class="icon on" id="camBtn" data-icon="cam" title="Cámara (V)" aria-label="Cámara"></button>
    <button class="icon" id="screenBtn" data-icon="screen" title="Compartir pantalla" aria-label="Compartir pantalla"></button>
    <button class="icon" id="cam2Btn" data-icon="plus" title="Agregar otra cámara" aria-label="Agregar otra cámara"></button>
    <button class="icon" id="setBtn" data-icon="settings" title="Cámara, micrófono y audífonos" aria-label="Ajustes"></button>
    <button class="icon" id="handBtn" data-icon="hand" title="Levantar la mano" aria-label="Levantar la mano"></button>
    <button class="icon" id="reactBtn" data-icon="smile" title="Reaccionar" aria-label="Reaccionar"></button>
    <button class="icon" id="chatBtn" data-icon="chat" title="Chat" aria-label="Chat"></button>
    <span class="pill" id="stageState">backstage</span>
    <button class="danger" id="leaveBtn" data-icon="leave">Salir</button>
  </div>
  <div class="card drawer hidden" id="chat">
    <div class="chatlog" id="chatlog"></div>
    <div class="row"><input id="chatInput" maxlength="500" placeholder="Mensaje…"><button id="chatSend" class="primary">Enviar</button></div>
  </div>
  <div class="card hidden" id="reactions" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px"></div>
</section>
<script type="module" src="/js/guest.js"></script>
<script type="module" src="/js/pwa.js"></script>
</body>
</html>
