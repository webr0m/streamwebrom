plugins { id 'com.android.application' }

android {
    namespace 'lat.webrom.streamwebrom'
    compileSdk 35
    defaultConfig {
        applicationId 'lat.webrom.streamwebrom'
        minSdk 26
        targetSdk 35
        versionCode 10500
        versionName '1.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
