name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.x' }
      - name: ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with: { node-version: 22 }
      - name: check JS syntax
        if: runner.os == 'Linux'
        run: for f in web/js/*.js; do cp $f /tmp/$(basename $f).mjs; node --check /tmp/$(basename $f).mjs; done
      - name: static check JS (undeclared identifiers, bad imports)
        if: runner.os == 'Linux'
        run: pip install esprima && python3 scripts/jslint.py web/js
      - name: signalling and storage regression tests
        if: runner.os == 'Linux'
        run: node --test tests/*.test.mjs
      - name: known reachable vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.x' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: make all
      - run: make launcher
      - run: |
          cd dist
          mv windows-launcher/StreamWebRom.exe StreamWebRom-Windows-x64.exe
          rm -rf windows-launcher
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: streamwebrom, path: dist/* }
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.64.0 Pillow==13.0.0
      - run: playwright install --with-deps chromium webkit
      - name: start disposable server
        run: |
          go build -o /tmp/streamwebrom ./cmd/streamwebrom
          /tmp/streamwebrom -addr 127.0.0.1:18443 -stun= -data /tmp/swr-smoke > /tmp/swr.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18443/api/health && break; sleep 1; done
      - run: python scripts/browser-smoke.py --url http://localhost:18443
      - run: python scripts/call-smoke.py --url http://localhost:18443
      - run: python scripts/framing-smoke.py --url http://localhost:18443
      - run: python scripts/screen-share-smoke.py --url http://localhost:18443
      - run: python scripts/interface-smoke.py --url http://localhost:18443
      - run: python scripts/studio-smoke.py --url http://localhost:18443
      - run: python scripts/relay-vdo-smoke.py --url http://localhost:18443
      - run: python scripts/effects-smoke.py --url http://localhost:18443
      - name: TURN/TCP relay-only integration
        run: |
          go build -o /tmp/turn-smoke scripts/turn-smoke-server.go
          /tmp/turn-smoke > /tmp/turn.log 2>&1 &
          /tmp/streamwebrom -addr 127.0.0.1:18444 -stun= -turn 'turn:127.0.0.1:13478?transport=tcp' -turn-user swr-test -turn-pass test-only -data /tmp/swr-relay > /tmp/swr-relay.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18444/api/health && break; sleep 1; done
          python scripts/relay-smoke.py --url http://localhost:18444
      - name: native TURN keeps media available with corrupt Cloudflare quota
        run: |
          mkdir -p /tmp/swr-native
          python -c "from pathlib import Path; Path('/tmp/swr-native/turn-quota.json').write_bytes(bytes(568))"
          SWR_CF_ACCOUNT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa SWR_CF_TURN_KEY_ID=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb SWR_CF_TURN_KEY_TOKEN=test-only SWR_CF_ANALYTICS_TOKEN=test-only SWR_RELAY_SECRET=test-local-secret-at-least-32-characters /tmp/streamwebrom -addr 127.0.0.1:18445 -stun= -udp-port 15000 -relay-listen 127.0.0.1:13479 -relay-public-ip 127.0.0.1 -relay-min 25160 -relay-max 25223 -data /tmp/swr-native > /tmp/swr-native.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:18445/api/health && break; sleep 1; done
          python scripts/relay-smoke.py --url http://localhost:18445 --tcp-only --expect-provider local
          python -c "import json, urllib.request; from pathlib import Path; c=json.load(urllib.request.urlopen('http://localhost:18445/api/config')); assert c['relay']=={'provider':'local','reason':'room-auth-required'}; assert 'state-unavailable' in Path('/tmp/swr-native.log').read_text(); assert Path('/tmp/swr-native/turn-quota.json').read_bytes()==bytes(568)"
