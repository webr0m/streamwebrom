name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with: { node-version: 22 }
      - name: check JS syntax
        if: runner.os == 'Linux'
        run: for f in web/js/*.js; do cp $f /tmp/$(basename $f).mjs; node --check /tmp/$(basename $f).mjs; done
      - name: static check JS (undeclared identifiers, bad imports)
        if: runner.os == 'Linux'
        run: pip install esprima && python3 scripts/jslint.py web/js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: make all
      - run: make launcher
      - run: |
          cd dist
          mv windows-launcher/StreamWebRom.exe StreamWebRom-Windows-x64.exe
          rm -rf windows-launcher
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: streamwebrom, path: dist/* }
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/*", generate_release_notes: true }
