name: relay-connectivity
on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS address of the installation to test
        type: string
        default: https://stream.webrom.lat
        required: true
      provider:
        type: choice
        options: [cloudflare, local]
        required: true
      mode:
        description: Client route (local can be tested while Cloudflare is active)
        type: choice
        options: [auto, tls, local, automatic]
        default: auto
      exercise_cutoff:
        description: Require automatic quota cutoff and decoded video after local reconnection (configure a temporary test budget first)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  remote-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.64.0
      - run: playwright install --with-deps chromium
      - name: actual video from an external network through the configured relay
        env:
          EXPECT_PROVIDER: ${{ inputs.provider }}
          STUDIO_URL: ${{ inputs.url }}
          EXPECT_CUTOFF: ${{ inputs.exercise_cutoff }}
          CLIENT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$CLIENT_MODE" = automatic ]; then
            python scripts/automatic-route-smoke.py --url "$STUDIO_URL"
          else
            python scripts/relay-smoke.py --url "$STUDIO_URL" --tcp-only --expect-provider "$EXPECT_PROVIDER" --mode "$CLIENT_MODE"
          fi
